<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Criminal Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-2xl rounded-2xl w-full max-w-md p-6">
    <h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2>

    <form action="admin_dashboard.html" method="get" class="space-y-4">
      
      <input type="text" placeholder="Jail ID" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="text" placeholder="Admin ID" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="password" placeholder="Password" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400">
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-xl hover:bg-blue-700">Login as Admin</button>
      
    </form>

    <div class="mt-4 text-center">
      <a href="family_login.html" class="text-blue-600 hover:underline">Login as Family Member?</a>
    </div>
  </div>

</body>
</html>
